<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Roboto&display=swap" rel="stylesheet">
    <link type="image/x-icon" rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/4287/4287555.png"/>
    <link rel="stylesheet" href="./CSS/style-one.css"/>
    <link rel="stylesheet" href="./CSS/martians.css"/>
    <link rel="stylesheet" href="./CSS/nasa.css"/>
    <title>NASA Videos about Mars</title>
</head>
<body>
<main class="container">
    <a href="#" class="back-to-top">⬆ Back to Top</a>
    <h2>NASA Videos about Mars</h2>
    <p class="nasa-intro">Landings, drives, flights and plans for the future — straight from the open NASA Image and
        Video Library. Every video opens here, on this page, and the background music pauses while you watch.</p>
    <div id="videos-root"></div>
</main>

<div class="modal fade nasa-modal" id="nasaVideoModal" tabindex="-1" aria-labelledby="nasaVideoTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="nasaVideoTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <video id="nasaVideoPlayer" controls playsinline preload="metadata"></video>
                <p class="nasa-meta" id="nasaVideoMeta"></p>
                <p class="nasa-text" id="nasaVideoText"></p>
            </div>
        </div>
    </div>
</div>

<script src="./js/data.js"></script>
<script src="./js/common.js"></script>
<script src="./js/forms.js"></script>
<script src="./js/martians.js"></script>
<script src="./js/nasa.js"></script>
<script src="./js/videos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
